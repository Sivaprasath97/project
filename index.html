<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand"><div class="brand-logo">A</div> AppName</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account to continue.</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-error" data-for="email"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-pass" data-target="password">Show</button>
        </div>
        <div class="field-error" data-for="password"></div>
      </div>

      <div class="form-row">
        <label><input type="checkbox" id="remember" /> Remember me</label>
        <a href="#" id="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Log in</button>
    </form>

    <p class="switch-link">Don't have an account? <a href="register.html">Create one</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
