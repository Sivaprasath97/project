<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand"><div class="brand-logo">A</div> AppName</div>
    <h1>Create an account</h1>
    <p class="subtitle">It only takes a minute.</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe" autocomplete="name" />
        <div class="field-error" data-for="name"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-error" data-for="email"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" />
          <button type="button" class="toggle-pass" data-target="password">Show</button>
        </div>
        <div class="strength"><span id="strengthBar"></span></div>
        <div class="field-error" data-for="password"></div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password" />
        <div class="field-error" data-for="confirm"></div>
      </div>

      <div class="form-row">
        <label><input type="checkbox" id="terms" /> I agree to the Terms &amp; Privacy Policy</label>
      </div>
      <div class="field-error" data-for="terms" style="margin-top:-14px;margin-bottom:14px"></div>

      <button type="submit" class="btn">Create account</button>
    </form>

    <p class="switch-link">Already have an account? <a href="index.html">Log in</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
